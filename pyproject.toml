[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gqai-music"
version = "0.1.0"
description = "Independent background-music planning and mixing system for GQAI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.32,<1",
]

[project.scripts]
gqai-music = "gqai_music.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gqai_music = ["web/*"]

